include=~/.config/omarchy/current/theme/fuzzel.ini

[main]
font=JetBrainsMono Nerd Font:size=9
dpi-aware=yes
fields=name,generic,comment,categories,filename,keywords
terminal=alacritty -e
prompt="   "
layer=overlay
width=40
horizontal-pad=40
vertical-pad=40
inner-pad=10
line-height=16
lines=20
tabs=no

[border]
width=2
radius=0

[dmenu]
mode=text
exit-immediately-if-empty=yes
