# Ristretto theme for swaylock
# Coffee-inspired warm color scheme

# General
font=JetBrainsMono Nerd Font

image=$HOME/.config/omarchy/current/background

# Colors from ristretto palette
ring-color=#f9cc6c
text-color=#e6d9db
inside-color=#2c252530
line-color=#f9cc6c

# Cleared state (success/ready indication)
ring-clear-color=#adda78
text-clear-color=#e6d9db
inside-clear-color=#2c2525
line-clear-color=#adda78

# Key press highlight (typing feedback)
key-hl-color=#fd6883
