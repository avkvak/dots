# Catppuccin Latte theme for swaylock
# Soothing pastel colors for the high-spirited

# General
font=JetBrainsMono Nerd Font

image=$HOME/.config/omarchy/current/background

# Colors from catppuccin-latte palette
ring-color=#8839EF
text-color=#4C4F69
inside-color=#EFF1F530
line-color=#8839EF

# Cleared state (success/ready indication)
ring-clear-color=#40A02B
text-clear-color=#4C4F69
inside-clear-color=#EFF1F5
line-clear-color=#40A02B

# Key press highlight (typing feedback)
key-hl-color=#DC8A78
