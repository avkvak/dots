# Hackerman theme for swaylock
# Classic hacker green aesthetic for the cyberpunk enthusiast

# General
font=JetBrainsMono Nerd Font

image=$HOME/.config/omarchy/current/background

# Colors from hackerman palette
ring-color=#50f872
text-color=#ddf7ff
inside-color=#0B0C1630
line-color=#50f872

# Cleared state (success/ready indication)
ring-clear-color=#4fe88f
text-clear-color=#ddf7ff
inside-clear-color=#0B0C16
line-clear-color=#4fe88f

# Key press highlight (typing feedback)
key-hl-color=#7cf8f7
