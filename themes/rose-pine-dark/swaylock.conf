# Rosé Pine theme for swaylock
# All natural pine, faux fur and a bit of soho vibes for the classy minimalist

# General
font=sans-serif

image=$HOME/.config/omarchy/current/background

# Colors from Rosé Pine palette
ring-color=908caa
text-color=e0def4
inside-color=19172430
line-color=908caa

# Cleared state (success/ready indication)
ring-clear-color=c4a7e7
text-clear-color=e0def4
inside-clear-color=1f1d2e
line-clear-color=c4a7e7

# Key press highlight (typing feedback)
key-hl-color=9ccfd8
