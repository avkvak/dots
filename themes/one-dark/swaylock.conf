# One Dark theme for swaylock
# VSCode-inspired dark theme with vibrant accents

# General
font=JetBrainsMono Nerd Font

image=$HOME/.config/omarchy/current/background

# Colors from one-dark palette
ring-color=#61afef
text-color=#abb2bf
inside-color=#282c3430
line-color=#61afef

# Cleared state (success/ready indication)
ring-clear-color=#98c379
text-clear-color=#abb2bf
inside-clear-color=#282c34
line-clear-color=#98c379

# Key press highlight (typing feedback)
key-hl-color=#c678dd
