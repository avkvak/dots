# Ethereal theme for swaylock
# Dreamy pastel aesthetic with celestial vibes

# General
font=JetBrainsMono Nerd Font

image=$HOME/.config/omarchy/current/background

# Colors from ethereal palette
ring-color=#7d82d9
text-color=#ffcead
inside-color=#060B1E30
line-color=#7d82d9

# Cleared state (success/ready indication)
ring-clear-color=#92a593
text-clear-color=#ffcead
inside-clear-color=#060B1E
line-clear-color=#92a593

# Key press highlight (typing feedback)
key-hl-color=#c89dc1
