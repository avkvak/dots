# Flowers One Light theme for swaylock
# Soft floral pastel colors for a gentle, soothing aesthetic

# General
font=JetBrainsMono Nerd Font

image=$HOME/.config/omarchy/current/background

# Colors from flowers-one-light palette
ring-color=39344F
text-color=39344F
inside-color=FAF4ED30
line-color=39344F

# Cleared state (success/ready indication)
ring-clear-color=88C0D0
text-clear-color=39344F
inside-clear-color=FAF4ED
line-clear-color=88C0D0

# Key press highlight (typing feedback)
key-hl-color=FAF4ED
