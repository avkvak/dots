# Everforest theme for swaylock
# Warm and soft green-based color scheme

# General
font=JetBrainsMono Nerd Font

image=$HOME/.config/omarchy/current/background

# Colors from everforest palette
ring-color=#7fbbb3
text-color=#d3c6aa
inside-color=#2d353b30
line-color=#7fbbb3

# Cleared state (success/ready indication)
ring-clear-color=#a7c080
text-clear-color=#d3c6aa
inside-clear-color=#2d353b
line-clear-color=#a7c080

# Key press highlight (typing feedback)
key-hl-color=#d699b6
