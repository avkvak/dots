# Osaka Jade theme for swaylock
# Japanese-inspired jade green aesthetic

# General
font=JetBrainsMono Nerd Font

image=$HOME/.config/omarchy/current/background

# Colors from osaka-jade palette
ring-color=#549E6A
text-color=#C1C497
inside-color=#111C1830
line-color=#549E6A

# Cleared state (success/ready indication)
ring-clear-color=#63b07a
text-clear-color=#C1C497
inside-clear-color=#111C18
line-clear-color=#63b07a

# Key press highlight (typing feedback)
key-hl-color=#2DD5B7
