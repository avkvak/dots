# Catppuccin Mocha theme for swaylock
# Soothing pastel colors for the high-spirited

# General
font=JetBrainsMono Nerd Font

image=$HOME/.config/omarchy/current/background

# Colors from catppuccin palette
ring-color=#B4BEFE
text-color=#CDD6F4
inside-color=#1E1E2E30
line-color=#B4BEFE

# Cleared state (success/ready indication)
ring-clear-color=#A6E3A1
text-clear-color=#CDD6F4
inside-clear-color=#1E1E2E
line-clear-color=#A6E3A1

# Key press highlight (typing feedback)
key-hl-color=#F5E0DC
