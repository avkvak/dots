# Gruvbox theme for swaylock
# Retro groove color scheme with warm earthy tones

# General
font=JetBrainsMono Nerd Font

image=$HOME/.config/omarchy/current/background

# Colors from gruvbox palette
ring-color=#d79921
text-color=#ebdbb2
inside-color=#28282830
line-color=#d79921

# Cleared state (success/ready indication)
ring-clear-color=#98971a
text-clear-color=#ebdbb2
inside-clear-color=#282828
line-clear-color=#98971a

# Key press highlight (typing feedback)
key-hl-color=#b16286
