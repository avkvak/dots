# Rose Pine theme for swaylock
# Soft floral pastel colors for a gentle aesthetic

# General
font=JetBrainsMono Nerd Font

image=$HOME/.config/omarchy/current/background

# Colors from rose-pine palette
ring-color=#907aa9
text-color=#575279
inside-color=#faf4ed30
line-color=#907aa9

# Cleared state (success/ready indication)
ring-clear-color=#286983
text-clear-color=#575279
inside-clear-color=#faf4ed
line-clear-color=#286983

# Key press highlight (typing feedback)
key-hl-color=#d7827e
