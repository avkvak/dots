# Matte Black theme for swaylock
# Sleek monochromatic aesthetic with dark elegance

# General
font=JetBrainsMono Nerd Font

image=$HOME/.config/omarchy/current/background

# Colors from matte-black palette
ring-color=#595959
text-color=#bebebe
inside-color=#12121230
line-color=#595959

# Cleared state (success/ready indication)
ring-clear-color=#FFC107
text-clear-color=#bebebe
inside-clear-color=#121212
line-clear-color=#FFC107

# Key press highlight (typing feedback)
key-hl-color=#D35F5F
