# Kanagawa theme for swaylock
# Colors inspired by the famous painting by Katsushika Hokusai

# General
font=JetBrainsMono Nerd Font

image=$HOME/.config/omarchy/current/background

# Colors from kanagawa palette
ring-color=#7e9cd8
text-color=#dcd7ba
inside-color=#1f1f2830
line-color=#7e9cd8

# Cleared state (success/ready indication)
ring-clear-color=#76946a
text-clear-color=#dcd7ba
inside-clear-color=#1f1f28
line-clear-color=#76946a

# Key press highlight (typing feedback)
key-hl-color=#957fb8
