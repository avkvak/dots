# Nord theme for swaylock
# Arctic color scheme inspired by the frozen north

# General
font=JetBrainsMono Nerd Font

image=$HOME/.config/omarchy/current/background

# Colors from nord palette
ring-color=#88C0D0
text-color=#D8DEE9
inside-color=#2E344030
line-color=#88C0D0

# Cleared state (success/ready indication)
ring-clear-color=#A3BE8C
text-clear-color=#D8DEE9
inside-clear-color=#2E3440
line-clear-color=#A3BE8C

# Key press highlight (typing feedback)
key-hl-color=#B48EAD
