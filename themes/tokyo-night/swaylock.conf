# Tokyo Night theme for swaylock
# Dark theme inspired by the neon lights of Tokyo at night

# General
font=JetBrainsMono Nerd Font

image=$HOME/.config/omarchy/current/background

# Colors from tokyo-night palette
ring-color=#7aa2f7
text-color=#c0caf5
inside-color=#1a1b2630
line-color=#7aa2f7

# Cleared state (success/ready indication)
ring-clear-color=#9ece6a
text-clear-color=#c0caf5
inside-clear-color=#1a1b26
line-clear-color=#9ece6a

# Key press highlight (typing feedback)
key-hl-color=#bb9af7
